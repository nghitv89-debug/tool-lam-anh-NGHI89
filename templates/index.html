<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Studio Pro - Giữ Nét Gốc 100%</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .tab-btn.active { background-color: #1e293b; border-bottom: 2px solid #3b82f6; color: #60a5fa; }
    </style>
</head>
<body class="font-sans antialiased">
    <div class="max-w-7xl mx-auto px-4 py-6">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400">AI PHOTO STUDIO PRO</h1>
            <p class="text-gray-400 text-sm mt-1">Chỉnh sửa ảnh thẻ & Phục hồi ảnh cũ - Bảo tồn diện mạo gốc 100%</p>
        </header>

        <div class="flex justify-center border-b border-gray-700 mb-6">
            <button id="tab-id-btn" onclick="switchTab('id')" class="tab-btn active px-6 py-3 font-medium text-lg">Chỉnh Sửa Ảnh Thẻ</button>
            <button id="tab-restore-btn" onclick="switchTab('restore')" class="tab-btn px-6 py-3 font-medium text-lg">Phục Hồi Ảnh Cũ</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 bg-slate-800 p-5 rounded-xl border border-slate-700">
                <div id="panel-id">
                    <h2 class="text-lg font-semibold mb-4 text-blue-300">Tùy chỉnh Ảnh Thẻ</h2>
                    <form onsubmit="processImage(event, '/api/process-id-photo')">
                        <div class="mb-4">
                            <label class="block text-sm mb-2">Tải ảnh gốc:</label>
                            <input type="file" name="file" required accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm mb-2">Màu phông nền:</label>
                            <select name="bg_color" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                                <option value="#003399">Xanh Chuẩn Ảnh Thẻ (#003399)</option>
                                <option value="#FFFFFF">Phông Trắng (#FFFFFF)</option>
                                <option value="#1E90FF">Xanh Nhạt (#1E90FF)</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition">Tạo Ảnh Thẻ One-Click</button>
                    </form>
                </div>

                <div id="panel-restore" class="hidden">
                    <h2 class="text-lg font-semibold mb-4 text-purple-300">Phục Hồi Ảnh Cũ & Ảnh Thờ</h2>
                    <form onsubmit="processImage(event, '/api/restore-old-photo')">
                        <div class="mb-4">
                            <label class="block text-sm mb-2">Tải ảnh cũ/mờ/đen trắng:</label>
                            <input type="file" name="file" required accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
                        </div>
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-2.5 rounded-lg transition">Phục Hồi Ảnh One-Click</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-8 bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col items-center justify-center min-h-[400px]">
                <div id="loading" class="hidden text-center">
                    <div class="inline-block animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mb-3"></div>
                    <p class="text-sm text-gray-300">Đang xử lý AI trên máy chủ... Vui lòng đợi.</p>
                </div>

                <div id="result-container" class="hidden text-center w-full">
                    <h3 class="text-lg font-medium mb-4 text-green-400">Kết Quả Hoàn Thành</h3>
                    <img id="output-image" src="" alt="Kết quả" class="max-h-[450px] mx-auto rounded border border-slate-600 shadow-lg mb-4">
                    <a id="download-btn" href="" download="result.png" target="_blank" class="inline-block bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-lg font-medium">Tải Ảnh Về</a>
                </div>

                <div id="placeholder" class="text-gray-500 text-center">
                    <p>Kết quả xử lý sẽ hiển thị tại đây</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(tab === 'id') {
                document.getElementById('tab-id-btn').classList.add('active');
                document.getElementById('panel-id').classList.remove('hidden');
                document.getElementById('panel-restore').classList.add('hidden');
            } else {
                document.getElementById('tab-restore-btn').classList.add('active');
                document.getElementById('panel-restore').classList.remove('hidden');
                document.getElementById('panel-id').classList.add('hidden');
            }
        }

        async function processImage(event, apiUrl) {
            event.preventDefault();
            const formData = new FormData(event.target);
            
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const response = await fetch(apiUrl, { method: 'POST', body: formData });
                const data = await response.json();

                if(data.status === 'success') {
                    document.getElementById('output-image').src = data.image_url;
                    document.getElementById('download-btn').href = data.image_url;
                    document.getElementById('result-container').classList.remove('hidden');
                } else {
                    alert('Lỗi xử lý: ' + data.message);
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ!');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
